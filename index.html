<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="おしどり帳">
<meta name="theme-color" content="#FBF3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#201720" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>おしどり帳</title>
<style>
:root {
  --bg: #FBF3F0; --surface: #FFFFFF; --surface-2: #FDF7F5; --ink: #3A2B33;
  --ink-soft: #93777F; --rose: #E56B93; --rose-deep: #C9527B; --rose-soft: #FBE3EC;
  --teal: #2F8F9D; --teal-deep: #23707C; --teal-soft: #DDEFF1;
  --sage: #4E9E80; --sage-soft: #E1F0E9; --amber: #D68A38; --amber-soft: #FBEEDC;
  --blue: #5B8DBE; --blue-soft: #E2ECF5;
  --line: #F0E1E5; --shadow: 0 6px 22px rgba(200,120,150,.14); --shadow-sm: 0 2px 8px rgba(200,120,150,.12);
  --radius: 20px;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #201720; --surface: #2C2029; --surface-2: #342531; --ink: #F4E7EC;
    --ink-soft: #B99BA8; --rose: #F384AB; --rose-deep: #F384AB; --rose-soft: #43303B;
    --teal: #62BAC7; --teal-deep: #62BAC7; --teal-soft: #23383D;
    --sage: #82C6A9; --sage-soft: #29392F; --amber: #E7B274; --amber-soft: #3C3020;
    --blue: #8FB4D8; --blue-soft: #263442;
    --line: #3D2C37; --shadow: 0 6px 22px rgba(0,0,0,.35); --shadow-sm: 0 2px 8px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #201720; --surface: #2C2029; --surface-2: #342531; --ink: #F4E7EC;
  --ink-soft: #B99BA8; --rose: #F384AB; --rose-deep: #F384AB; --rose-soft: #43303B;
  --teal: #62BAC7; --teal-deep: #62BAC7; --teal-soft: #23383D;
  --sage: #82C6A9; --sage-soft: #29392F; --amber: #E7B274; --amber-soft: #3C3020;
  --blue: #8FB4D8; --blue-soft: #263442;
  --line: #3D2C37; --shadow: 0 6px 22px rgba(0,0,0,.35); --shadow-sm: 0 2px 8px rgba(0,0,0,.3);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); }
body {
  font-family: var(--font-body); color: var(--ink);
  background:
    radial-gradient(120% 90% at 92% -8%, var(--rose-soft) 0%, transparent 52%),
    radial-gradient(120% 90% at 2% 2%, var(--teal-soft) 0%, transparent 42%),
    var(--bg);
  background-attachment: fixed;
  min-height: 100vh;
  padding-bottom: calc(74px + env(safe-area-inset-bottom));
  -webkit-font-smoothing: antialiased;
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.num { font-family: var(--font-round); font-variant-numeric: tabular-nums; }

/* ---- ヘッダ ---- */
header.top {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 12px) 16px 10px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.brand { font-family: var(--font-round); font-weight: 800; font-size: 1.12rem; display: flex; align-items: center; gap: 7px; }
.brand .duck { font-size: 1.3rem; }
.menu-btn { border: none; background: var(--surface); width: 38px; height: 38px; border-radius: 12px; box-shadow: var(--shadow-sm); font-size: 1.05rem; color: var(--ink); cursor: pointer; }
.menu-btn:active { transform: scale(.94); }

/* ---- メイン ---- */
main.wrap { max-width: 480px; margin: 0 auto; padding: 4px 16px 24px; }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 16px; margin-bottom: 14px; }
h2.sec { font-family: var(--font-round); font-size: .95rem; margin: 18px 2px 8px; color: var(--ink); display: flex; align-items: center; gap: 6px; }
.muted { color: var(--ink-soft); font-size: .78rem; }
.grow { flex: 1; }

/* ---- きろく：今日ヒーロー ---- */
.hero { text-align: center; padding: 18px 16px 14px; }
.hero .date { font-weight: 700; color: var(--ink-soft); font-size: .85rem; }
.hero .stamp-big { font-size: 52px; line-height: 1.25; min-height: 66px; display: grid; place-items: center; }
.hero .total { font-family: var(--font-round); font-weight: 800; font-size: 1.7rem; font-variant-numeric: tabular-nums; }
.hero .word { font-size: .82rem; font-weight: 700; margin-top: 2px; }
.chips { display: flex; gap: 8px; margin: 2px 0 14px; }
.chip-card { flex: 1; background: var(--surface); border: none; text-align: left; border-radius: 15px; box-shadow: var(--shadow-sm); padding: 10px 12px; cursor: pointer; font-family: var(--font-body); color: var(--ink); }
.chip-card:active { transform: scale(.98); }
.chip-card .t { font-size: .68rem; font-weight: 700; color: var(--ink-soft); display: block; }
.chip-card .v { display: block; font-family: var(--font-round); font-weight: 800; font-size: 1.02rem; font-variant-numeric: tabular-nums; }
.chip-card .s { display: block; font-size: .66rem; color: var(--ink-soft); white-space: nowrap; }
.hero .split { display: flex; justify-content: center; gap: 28px; margin-top: 2px; }
.hero .split span { display: block; font-size: .7rem; font-weight: 700; color: var(--ink-soft); }
.hero .split b { font-family: var(--font-round); font-weight: 800; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.chip-card.over .v { color: var(--rose-deep); }

/* ---- 入力フォーム ---- */
.field { margin-bottom: 12px; }
.field label { display: block; font-size: .76rem; font-weight: 700; color: var(--ink-soft); margin-bottom: 5px; }
.field input, .field textarea {
  width: 100%; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink);
  border-radius: 13px; padding: 13px 14px; font-size: 15px; font-family: var(--font-body);
  outline: none; transition: border-color .15s ease; resize: none;
}
.field input:focus, .field textarea:focus { border-color: var(--rose); }
input.amt-input { font-family: var(--font-round); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 1.25rem !important; }
.catgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.catgrid button {
  border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink);
  border-radius: 12px; padding: 8px 2px 7px; cursor: pointer; font-family: var(--font-body);
  display: flex; flex-direction: column; align-items: center; gap: 1px;
}
.catgrid button .e { font-size: 1.25rem; }
.catgrid button .n { font-size: .64rem; font-weight: 700; color: var(--ink-soft); }
.catgrid button.on { border-color: var(--rose); background: var(--rose-soft); }
.catgrid button.on .n { color: var(--rose-deep); }
.btn { border: none; border-radius: 14px; padding: 14px; font-size: .98rem; font-weight: 700; cursor: pointer; transition: transform .1s ease; font-family: var(--font-body); }
.btn:active { transform: scale(.98); }
.btn.primary { background: linear-gradient(140deg, var(--rose) 0%, var(--rose-deep) 100%); color: #fff; box-shadow: var(--shadow-sm); width: 100%; }
.btn.ghost { background: var(--surface-2); color: var(--ink-soft); }
.btn.del { background: none; color: #D9534F; width: 100%; margin-top: 4px; font-size: .85rem; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.del { color: #F09B98; } }
:root[data-theme="dark"] .btn.del { color: #F09B98; }
.zero-btn { width: 100%; border: 1.5px dashed var(--line); background: none; color: var(--ink-soft); border-radius: 13px; padding: 11px; font-weight: 700; font-size: .85rem; cursor: pointer; font-family: var(--font-body); margin-top: 9px; }
.zero-btn.on { border-style: solid; border-color: var(--rose); background: var(--rose-soft); color: var(--rose-deep); }

/* ---- 記録リスト行 ---- */
.entry-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface-2); border-radius: 12px; cursor: pointer; margin-bottom: 7px; }
.entry-row:active { background: var(--rose-soft); }
.entry-row .ic { width: 36px; height: 36px; border-radius: 11px; background: var(--surface); box-shadow: var(--shadow-sm); display: grid; place-items: center; font-size: 1.15rem; flex: none; }
.entry-row .nm { font-weight: 700; font-size: .88rem; }
.entry-row .memo { font-size: .72rem; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
.entry-row .amt { font-family: var(--font-round); font-weight: 800; font-variant-numeric: tabular-nums; font-size: .98rem; }
.nostamp-tag { font-size: .6rem; font-weight: 700; color: var(--blue); background: var(--blue-soft); padding: 1px 6px; border-radius: 99px; margin-left: 5px; vertical-align: 1px; }

/* ---- カレンダー ---- */
.calbar { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 4px 0 10px; }
.calbar .ym { font-family: var(--font-round); font-weight: 800; font-size: 1.05rem; min-width: 130px; text-align: center; }
.calbar button { border: none; background: var(--surface); width: 34px; height: 34px; border-radius: 11px; box-shadow: var(--shadow-sm); color: var(--ink); font-size: 1rem; cursor: pointer; }
.calbar .todaybtn { width: auto; padding: 0 12px; font-size: .74rem; font-weight: 700; color: var(--teal-deep); }
.calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.calgrid .wd { text-align: center; font-size: .66rem; font-weight: 700; color: var(--ink-soft); padding: 3px 0 5px; }
.calgrid .wd.sun { color: var(--rose-deep); } .calgrid .wd.sat { color: var(--teal-deep); }
.cell { position: relative; border: none; background: var(--surface); border-radius: 11px; min-height: 48px; padding: 2px 2px 1px; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-family: var(--font-body); }
.cell:active { background: var(--rose-soft); }
.cell.blank { background: none; box-shadow: none; cursor: default; }
.cell .d { font-size: .68rem; font-weight: 700; color: var(--ink); line-height: 1.2; }
.cell.sun .d, .cell.hol .d { color: var(--rose-deep); }
.cell.sat .d { color: var(--teal-deep); }
.cell.future { opacity: .45; }
.cell.today { outline: 2px solid var(--rose); outline-offset: -2px; }
.cell .st { font-size: 1.05rem; line-height: 1.35; min-height: 22px; display: grid; place-items: center; font-weight: 800; }
.cell .st.t-nijuu { color: var(--sage); } .cell .st.t-maru { color: var(--teal); } .cell .st.t-sankaku { color: var(--amber); }
.cell .marks { position: absolute; top: 2px; right: 3px; font-size: .5rem; line-height: 1.1; display: flex; gap: 1px; }
.cell .amt { font-size: .52rem; color: var(--ink-soft); font-family: var(--font-round); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 10px; justify-content: center; margin-top: 6px; font-size: .62rem; color: var(--ink-soft); font-weight: 700; }
.dn { padding: 8px 12px; margin-bottom: 8px; }
.dn-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dn-t { font-family: var(--font-round); font-weight: 800; font-size: .86rem; }
.dn-info { border: none; background: var(--sage-soft); color: var(--sage); border-radius: 99px; padding: 3px 9px; font-size: .68rem; font-weight: 700; cursor: pointer; font-family: var(--font-body); }
.dn-main { display: flex; align-items: center; gap: 9px; margin-top: 3px; }
.dn-ic { font-size: 1.5rem; flex: none; }
.dn-tx { flex: 1; min-width: 0; }
.dn-nm { font-weight: 800; font-size: .98rem; overflow-wrap: anywhere; }
.dn-pr { font-size: .72rem; color: var(--ink-soft); margin-left: 7px; font-weight: 700; }
.dn-why { font-size: .7rem; color: var(--ink-soft); }
.dn-acts { display: flex; gap: 6px; margin-top: 5px; }
.dn-btn { flex: 1; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 10px; padding: 5px 2px; font-size: .72rem; font-weight: 700; cursor: pointer; font-family: var(--font-body); }
.dn-btn.pri { background: var(--rose-soft); border-color: var(--rose); color: var(--rose-deep); }
.dn-btn:disabled { opacity: .45; cursor: default; }
.dn-stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.dn-stat div { background: var(--surface-2); border-radius: 12px; padding: 9px 4px; text-align: center; }
.dn-stat span { display: block; font-size: .62rem; color: var(--ink-soft); font-weight: 700; }
.dn-tbl { width: 100%; border-collapse: collapse; font-size: .78rem; }
.dn-tbl th { font-size: .66rem; color: var(--ink-soft); text-align: left; padding: 4px 5px; border-bottom: 1px solid var(--line); }
.dn-tbl td { padding: 8px 5px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.store-tbl tr { cursor: pointer; }
.wd-chips { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.wd-chips button { border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 10px; padding: 9px 0; font-weight: 700; cursor: pointer; font-family: var(--font-body); }
.wd-chips button.on { border-color: var(--rose); background: var(--rose-soft); color: var(--rose-deep); }
.dn-times { display: flex; align-items: center; gap: 8px; }
.dn-times input { min-width: 0; }
.dn-rates { display: flex; gap: 4px; }
.set-row .dn-rates input.mini { width: 46px; padding: 9px 4px; text-align: center; }
.set-row input.mini[type="time"] { width: 108px; }
.dn-crowd { display: flex; justify-content: space-between; align-items: center; font-size: .8rem; padding: 6px 0; }
.dn-crowd button { border: none; background: var(--surface-2); color: var(--ink-soft); border-radius: 8px; padding: 5px 10px; font-size: .72rem; cursor: pointer; }
.calsum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 6px; }
.calsum .b { background: var(--surface); border-radius: 13px; box-shadow: var(--shadow-sm); padding: 6px 6px; text-align: center; }
.calsum .b .v { font-family: var(--font-round); font-weight: 800; font-size: 1.05rem; }
.calsum .b .v.big { font-size: 1.6rem; line-height: 1.3; }
.calsum .b .t { font-size: .62rem; color: var(--ink-soft); font-weight: 700; }

/* ---- ふたり会議 ---- */
.segwrap { display: flex; gap: 5px; background: var(--rose-soft); padding: 4px; border-radius: 13px; margin-bottom: 10px; }
.segwrap button { flex: 1; border: none; background: none; border-radius: 10px; padding: 9px 2px; font-size: .78rem; font-weight: 700; color: var(--ink-soft); cursor: pointer; font-family: var(--font-body); }
.segwrap button.on { background: var(--surface); color: var(--rose-deep); box-shadow: 0 2px 6px rgba(0,0,0,.08); }
.periodbar { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
.periodbar .lb { text-align: center; }
.periodbar .lb .l1 { font-family: var(--font-round); font-weight: 800; font-size: .98rem; }
.periodbar .lb .l2 { font-size: .68rem; color: var(--ink-soft); }
.periodbar button { border: none; background: var(--surface); width: 32px; height: 32px; border-radius: 10px; box-shadow: var(--shadow-sm); color: var(--ink); cursor: pointer; }
.hero2 { text-align: center; padding: 14px 16px; }
.hero2 .big { font-family: var(--font-round); font-weight: 800; font-size: 1.9rem; font-variant-numeric: tabular-nums; }
.hero2 .split2 { display: flex; justify-content: center; gap: 28px; margin-top: 6px; }
.hero2 .split2 span { display: block; font-size: .7rem; font-weight: 700; color: var(--ink-soft); }
.hero2 .split2 b { font-family: var(--font-round); font-weight: 800; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.hero2 .sub { font-size: .74rem; color: var(--ink-soft); font-weight: 700; }
.hero2 .cmp { display: inline-block; margin-top: 6px; font-size: .74rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; }
.hero2 .cmp.down { background: var(--sage-soft); color: var(--sage); }
.hero2 .cmp.up { background: var(--rose-soft); color: var(--rose-deep); }
.hero2 .cmp.flat { background: var(--surface-2); color: var(--ink-soft); }
.catbar-row { display: flex; align-items: center; gap: 9px; padding: 7px 0; cursor: pointer; }
.catbar-row .e { font-size: 1.1rem; width: 24px; text-align: center; flex: none; }
.catbar-row .meta { flex: 1; min-width: 0; }
.catbar-row .l { display: flex; justify-content: space-between; font-size: .78rem; font-weight: 700; margin-bottom: 3px; }
.catbar-row .l .a { font-family: var(--font-round); font-variant-numeric: tabular-nums; }
.catbar-row .bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.catbar-row .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--teal), var(--rose)); }
.wk-row { padding: 8px 0; }
.wk-row .l { display: flex; justify-content: space-between; align-items: baseline; font-size: .78rem; font-weight: 700; margin-bottom: 4px; }
.wk-row .l .d { color: var(--ink-soft); font-weight: 700; font-size: .68rem; }
.wk-row .bar { height: 12px; border-radius: 99px; background: var(--surface-2); overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.06); }
.wk-row .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--sage), #6FBE9E); transition: width .5s cubic-bezier(.4,1.2,.5,1); }
.wk-row.over .bar i { background: linear-gradient(90deg, var(--amber), var(--rose-deep)); }
.wk-row.now { background: var(--surface-2); margin: 0 -10px; padding: 8px 10px; border-radius: 12px; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats3 .b { background: var(--surface); border-radius: 13px; box-shadow: var(--shadow-sm); padding: 10px 6px; text-align: center; }
.stats3 .b .v { font-family: var(--font-round); font-weight: 800; font-size: 1.15rem; }
.stats3 .b .t { font-size: .62rem; color: var(--ink-soft); font-weight: 700; }
.top5-row { display: flex; align-items: center; gap: 9px; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.top5-row:last-child { border-bottom: none; }
.top5-row .rank { font-family: var(--font-round); font-weight: 800; color: var(--rose-deep); width: 18px; text-align: center; flex: none; }
.empty { text-align: center; color: var(--ink-soft); padding: 26px 10px; font-size: .84rem; }
.empty .e { font-size: 38px; margin-bottom: 6px; }

/* ---- ボトムタブ ---- */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; max-width: 480px; margin: 0 auto; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 84%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-radius: 18px 18px 0 0; }
nav.tabs button { flex: 1; background: none; border: none; color: var(--ink-soft); font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 0; cursor: pointer; font-family: var(--font-body); }
nav.tabs button .ic { font-size: 21px; }
nav.tabs button.act { color: var(--rose-deep); }

/* ---- シート・スクリム ---- */
#modalRoot .modal { position: fixed; inset: 0; z-index: 60; background: rgba(40,25,35,.45); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); display: flex; align-items: flex-end; justify-content: center; }
#modalRoot .sheet { background: var(--surface); width: 100%; max-width: 480px; border-radius: 24px 24px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto; animation: up .25s; box-shadow: 0 -8px 30px rgba(0,0,0,.18); }
@keyframes up { from { transform: translateY(30px); opacity: .5; } to { transform: none; opacity: 1; } }
.sheet .grip { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 4px auto 14px; }
.sheet h3 { font-family: var(--font-round); font-size: 1.02rem; margin: 0 0 12px; }
.sheet-actions { display: flex; gap: 9px; margin-top: 6px; }
.sheet-actions .btn.primary { flex: 1; width: auto; }
.sheet-actions .btn.ghost { flex: 0 0 auto; padding: 14px 18px; }

/* ---- 右スライドページ ---- */
.slide { position: fixed; top: 0; right: 0; bottom: 0; width: 100%; max-width: 480px; z-index: 48; background: var(--bg); transform: translateX(100%); transition: transform .3s cubic-bezier(.3,1,.4,1); overflow-y: auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); box-shadow: -8px 0 30px rgba(0,0,0,.15); left: auto; margin: 0 auto; }
@media (min-width: 481px) { .slide { right: calc((100vw - 480px) / 2); } }
.slide.show { transform: translateX(0); }
.slide-scrim { position: fixed; inset: 0; background: rgba(40,25,35,.35); opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 45; }

<script>

/* ---------- 小道具 ---------- */

/* ---------- 日付ユーティリティ ---------- */
function pad2(n) { return String(n).padStart(2, "0"); }
function ymd(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function fromYmd(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
function diffDays(a, b) {
  var ua = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
  var ub = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());

function jdateLong(s) { var d = fromYmd(s); return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日(" + WD[d.getDay()] + ")"; }

/* ---------- 日本の祝日（2020〜2099） ---------- */
var _holidayCache = {};
function nthMonday(year, month, nth) {
  var d = new Date(year, month - 1, 1);
  var offset = (8 - d.getDay()) % 7;
  return new Date(year, month - 1, 1 + offset + (nth - 1) * 7);

function shubunDay(y) { return Math.floor(23.2488 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4)); }

  if (_holidayCache[year]) return _holidayCache[year];
  var base = {};
  function set(m, d, name) { base[year + "-" + pad2(m) + "-" + pad2(d)] = name; }
  set(1, 1, "元日");
  base[ymd(nthMonday(year, 1, 2))] = "成人の日";
  set(2, 11, "建国記念の日");
  if (year >= 2020) set(2, 23, "天皇誕生日");
  set(3, shunbunDay(year), "春分の日");
  set(4, 29, "昭和の日");
  set(5, 3, "憲法記念日"); set(5, 4, "みどりの日"); set(5, 5, "こどもの日");
  base[ymd(nthMonday(year, 7, 3))] = "海の日";
  set(8, 11, "山の日");
  base[ymd(nthMonday(year, 9, 3))] = "敬老の日";
  set(9, shubunDay(year), "秋分の日");
  base[ymd(nthMonday(year, 10, 2))] = "スポーツの日";
  set(11, 3, "文化の日"); set(11, 23, "勤労感謝の日");
  var all = {}; Object.keys(base).forEach(function (k) { all[k] = base[k]; });
  Object.keys(base).forEach(function (k) {
    var d = fromYmd(k);
    if (d.getDay() === 0) {
      var t = addDays(d, 1);
      while (base[ymd(t)]) t = addDays(t, 1);
      all[ymd(t)] = "振替休日";
    }
  });
  Object.keys(base).forEach(function (k) {
    var d = fromYmd(k);
    var mid = addDays(d, 1), next = addDays(d, 2);
    if (base[ymd(next)] && !all[ymd(mid)] && mid.getDay() !== 0) all[ymd(mid)] = "国民の休日";
  });

  return all;
}
function isHoliday(d) { return !!jpHolidays(d.getFullYear())[ymd(d)]; }
function isWeekend(d) { return d.getDay() === 0 || d.getDay() === 6; }

/* ---------- 食費週・クレカ締め期間 ---------- */
function foodAnchor(year, month, anchorDay) {
  // カレンダーの「給与日」ボタンで指定した日があれば、それを起点にする
  var manual = DB && DB.paydays ? DB.paydays[year + "-" + pad2(month)] : "";
  if (manual) return fromYmd(manual);
  return foodAnchorAuto(year, month, anchorDay);

function foodAnchorAuto(year, month, anchorDay) {
  var lastDay = new Date(year, month, 0).getDate();
  var d = new Date(year, month - 1, Math.min(anchorDay, lastDay));
  while (isWeekend(d) || isHoliday(d)) d = addDays(d, -1);

// 起点日が小さいと「翌月の起点」が前倒しで当月内に食い込むため、
// アンカー列（単調増加）を走査して anchor(k) <= date < anchor(k+1) を満たす区間を取る
function foodPeriod(date, anchorDay) {
  var mi = date.getFullYear() * 12 + date.getMonth();
  function A(k) { return foodAnchor(Math.floor(k / 12), (k % 12) + 1, anchorDay); }
  var k = mi + 1;
  while (diffDays(A(k), date) < 0) k--;

  var end = addDays(A(k + 1), -1);

  while (diffDays(s, end) >= 0) {

}

  var p = foodPeriod(date, anchorDay);
  for (var i = 0; i < p.weeks.length; i++) {
    var w = p.weeks[i];
    if (diffDays(w.start, date) >= 0 && diffDays(date, w.end) >= 0) return { period: p, week: w };
  }
  return { period: p, week: null };
}
function periodByYM(cy, cm, closeDay) {
  function closeOf(yy, mm) {
    var last = new Date(yy, mm, 0).getDate();

}
function cardPeriod(date, closeDay) {
  var y = date.getFullYear(), m = date.getMonth() + 1;
  var last = new Date(y, m, 0).getDate();
  var thisClose = new Date(y, m - 1, Math.min(closeDay, last));
  var cy = y, cm = m;
  if (diffDays(date, thisClose) < 0) { cm++; if (cm === 13) { cm = 1; cy++; } }
  return periodByYM(cy, cm, closeDay);
}

/* ---------- 状態 ---------- */
var KEY = "oshidori_cho_v1";

function viewCal() {

  var hols = {};

  }
  // 🍚マーク: 期間内の毎週の食費週スタート日ぜんぶ（期間の起点日も第1週スタートとして含まれる）
  var weekStartSet = {}, paydaySet = {};

  while (diffDays(wd0, end) >= 0) {

    if (fw0.week && diffDays(fw0.week.start, wd0) === 0) weekStartSet[ymd(wd0)] = fw0.week.idx;

  h += '<div class="card" style="padding:8px 8px;margin-bottom:8px"><div class="calgrid">';

  });

    var inf2 = dayInfo(ds2);

    if (hols[ds2]) cls += " hol";

    // 月をまたぐ期間なので、1日だけは「9/1」のように月も出す
    var dLabel = d2.getDate() === 1 ? (d2.getMonth() + 1) + "/1" : String(d2.getDate());
    h += '<button class="' + cls + '" onclick="openDaySheet(\'' + ds2 + '\')">' +
      '<span class="d">' + dLabel + "</span>" +

/* ---------- 給与日（食費週の基準日） ---------- */
// 押した日が「どの月の給与日」かは、自動の起点日がいちばん近い月とする
// （月ごとの区画が重ならないので、起点の並びが前後に入れ替わらない）
function paydayKey(dateStr) {
  var hit = Object.keys(DB.paydays).filter(function (k) { return DB.paydays[k] === dateStr; })[0];
  if (hit) return hit; // 指定済みの日は、スタート日の設定を変えた後でも取り消せるように
  var d = fromYmd(dateStr), mi = d.getFullYear() * 12 + d.getMonth();
  var best = "", bestGap = Infinity;
  for (var k = mi - 1; k <= mi + 1; k++) {
    var y = Math.floor(k / 12), m = (k % 12) + 1;
    var gap = Math.abs(diffDays(d, foodAnchorAuto(y, m, DB.settings.foodAnchorDay)));
    if (gap < bestGap) { bestGap = gap; best = y + "-" + pad2(m); }
  }
  return best;
}
function paydayButtonHtml(dateStr) {
  var key = paydayKey(dateStr), manual = DB.paydays[key] || "";
  if (manual === dateStr) return '<button class="zero-btn on" onclick="togglePayday(\'' + dateStr + '\')">💴 給与日にしました（取り消す）</button>';
  var fw = foodWeekOf(fromYmd(dateStr), DB.settings.foodAnchorDay);

  return '<button class="zero-btn" onclick="togglePayday(\'' + dateStr + '\')">💴 この日を給与日にする</button>';
}
function togglePayday(dateStr) {

  if (on) {
    var p = key.split("-");
    var gap = Math.abs(diffDays(fromYmd(dateStr), foodAnchorAuto(+p[0], +p[1], DB.settings.foodAnchorDay)));
    if (gap > 7 && !confirm("いつもの給与日から" + gap + "日はなれています。この日を給与日にしますか？")) return;
    DB.paydays[key] = dateStr;
  } else delete DB.paydays[key];
  var okSave = save();
  render();
  if (okSave) toast(on ? "💴 ここを基準に週を組み直しました" : "給与日の指定を取り消しました");
  if (sheetDate === dateStr && $("daySheetBody")) refreshDaySheet();
}

/* ---------- 今日の晩ご飯 ---------- */
// 成績はきろくから毎回計算する（入力を直せば自動で追従し、ずれた値が残らない）。
// 変えないものだけ dinner.days に保存＝1日の提案は開き直しても変わらない。
var DINNER_REC_RATIO = 0.7;  // 週の7割以上の日にきろくがあれば成績に数える（つけ忘れを節約と誤認しない）
var DINNER_GOOD_USED = 0.7;  // 予算の7割以内で終えた週を「優秀」とする
var DINNER_HOT_STREAK = 2;   // この週数続けて達成で「好調」＝大きめの報酬
var DINNER_CHANCE = [0.4, 0.55]; // 外食を出す確率（通常・好調）＝条件を満たしても毎回は出さない
var DINNER_CROWD_DAYS = 90, DINNER_CROWD_LIMIT = 2; // 直近90日に2回で、その曜日×時間帯を外す
var SLOT_NAME = ["はやめ（〜17時台）", "ごはんどき（18〜19時台）", "おそめ（20時〜）"];
var DINNER_WHY = {
  nostore: "お店を設定から登録すると、外食も提案されます",
  budget: "週の予算を決めると、提案が始まります",
  pace: "今週はペースを整える週。今日はおうちでほっこり🏠",
  cap: "今週の外食はここまで。また来週のお楽しみ🌱",
  gap: "外食の次の日は、おうちごはんで調整",
  rest: "今日はおうちの日。外食枠がそのぶん育ちます🌱",
  funds: "今日行けるお店が見つからないので、おうちごはん",
  fail: "今日はおうちで食べる日に決まりました🏠",
  reroll: "安いお店が見つからなかったので、おうちごはん",
  norec: "きのうまでのきろくを入れると、今日の案が決まります"
};
var DINNER_RETRY = { nostore: 1, budget: 1, norec: 1 }; // 準備が整えば作り直す仮の案（本物の決定は1日固定）
function seedRand(s) {
  var h = 2166136261;
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function () {
    h = (h + 0x6D2B79F5) | 0;
    var t = Math.imul(h ^ (h >>> 15), 1 | h);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function weekBudget(w) { return Math.round(DB.settings.foodBudget * w.days / 7); }
function dinnerLast(rec) { return rec.steps[rec.steps.length - 1]; }
function dinnerStoreDays(a, b) { // 期間内で、最終的にお店になった日
  var sa = ymd(a), sb = ymd(b), out = [];
  Object.keys(DB.dinner.days).forEach(function (k) {
    if (k >= sa && k <= sb && dinnerLast(DB.dinner.days[k]).kind === "store") out.push(k);
  });
  return out;
}
function eatoutOf(dateStr) { // その日に晩ご飯（旧版は外食カテゴリ）で実際に使った額
  return entriesOf(dateStr).reduce(function (sum, e) { return sum + (e.dinner === true || e.catId === "eatout" ? e.amount : 0); }, 0);
}
function dinnerRewardSum(a, b) { // 提案に沿って実際に外食した額（行かなかった日は数えない）
  return dinnerStoreDays(a, b).reduce(function (sum, k) { return sum + Math.min(dinnerLast(DB.dinner.days[k]).price, eatoutOf(k)); }, 0);
}
function recordedDays(w) {
  var n = 0, d = w.start;
  while (diffDays(d, w.end) >= 0) { if (dayInfo(ymd(d)).recorded) n++; d = addDays(d, 1); }
  return n;
}
function dinnerRate(grade, prevPeriodOver, rates) {
  var r = rates || DB.settings.eatoutRates;
  if (grade === "bad") return r[0];
  if (grade === "good" && !prevPeriodOver) return r[2];
  return r[1];
}
// 始めた週から順に精算して、外食枠・貯金・連続達成を求める。枠は使うまで繰り越す
function dinnerLedger() {
  var st = DB.settings, td = today(), a = st.foodAnchorDay, dn = DB.dinner;
  if (!dn.start) dn.start = ymd(foodWeekOf(td, a).week.start); // 導入前のきろくは枠に入れない
  var L = { pool: 0, saved: 0, streak: 0, grade: "", weeks: [] };
  var periods = {}, startYmd = dn.start;
  var d = fromYmd(dn.start), guard = 0;
  while (guard++ < 2000) {
    var fw = foodWeekOf(d, a), w = fw.week;
    if (!w || diffDays(w.end, td) <= 0) break;
    if (ymd(w.start) < startYmd) { d = addDays(w.end, 1); continue; } // 給与日を動かして始めた日より前にかかる週は数えない
    // 終わった週は、その時点の予算とレートで固定する（設定を変えても過去の枠が動かない）
    var wKey = ymd(w.start), fixed = dn.closed[wKey];
    if (!fixed || fixed.end !== ymd(w.end)) fixed = dn.closed[wKey] = { end: ymd(w.end), budget: weekBudget(w), rates: st.eatoutRates.slice() };
    var pKey = ymd(fw.period.start), prevKey = ymd(foodPeriod(addDays(fw.period.start, -1), a).start);
    var prevOver = !!(periods[prevKey] && periods[prevKey].full && periods[prevKey].spent > periods[prevKey].budget);
    var rate = dinnerRate(L.grade, prevOver, fixed.rates);
    var B = fixed.budget, S = foodSpent(w.start, w.end);
    var enough = recordedDays(w) >= Math.ceil(w.days * DINNER_REC_RATIO);
    var over = Math.max(0, S - B);
    var fromPool = Math.min(L.pool, dinnerRewardSum(w.start, w.end), over); // 報酬の外食は枠から払った分を成績に数えない
    var graded = S - fromPool;
    var grade = graded > B ? "bad" : !enough ? "norec" : (graded <= B * DINNER_GOOD_USED ? "good" : "normal");
    var addPool = 0, addSaved = 0;
    L.pool -= Math.min(L.pool, over); // オーバー分は枠で埋める
    if (enough && S < B) {
      addPool = Math.floor((B - S) * rate / 100);
      addSaved = B - S - addPool;
    }
    L.pool += addPool; L.saved += addSaved;
    if (!w.partial) { // 短い調整週は、たまたまの買い出しで成績が動かないよう評価に入れない
      L.streak = grade === "good" || grade === "normal" ? L.streak + 1 : 0;
      L.grade = grade;
    }
    L.weeks.push({ start: ymd(w.start), end: ymd(w.end), budget: B, spent: S, grade: grade, rate: rate, enough: enough, partial: w.partial, addPool: addPool, addSaved: addSaved });
    if (!periods[pKey]) periods[pKey] = { spent: 0, budget: 0, full: ymd(fw.period.start) >= startYmd };
    periods[pKey].spent += graded; periods[pKey].budget += B;
    d = addDays(w.end, 1);
  }
  var cw = foodWeekOf(td, a), cwk = cw.week;
  var cPrevKey = ymd(foodPeriod(addDays(cw.period.start, -1), a).start);
  var cPrevOver = !!(periods[cPrevKey] && periods[cPrevKey].full && periods[cPrevKey].spent > periods[cPrevKey].budget);
  var cB = weekBudget(cwk), cS = foodSpent(cwk.start, td);
  var cReward = dinnerRewardSum(cwk.start, addDays(td, -1));
  var hot = L.streak >= DINNER_HOT_STREAK;
  var firstDay = diffDays(cwk.start, td) === 0, missing = false;
  for (var md = cwk.start; diffDays(md, td) > 0; md = addDays(md, 1)) if (!dayInfo(ymd(md)).recorded) missing = true;
  L.cur = {
    firstDay: firstDay, missing: missing,
    period: cw.period, week: cwk, budget: cB, spent: cS, hot: hot,
    rate: dinnerRate(L.grade, cPrevOver),
    onPace: cB > 0 && cS - Math.min(L.pool, cReward) <= cB * (diffDays(cwk.start, td) + 1) / cwk.days,
    eatouts: dinnerStoreDays(cwk.start, addDays(td, -1)).filter(function (k) { return eatoutOf(k) > 0; }).length,
    cap: st.eatoutPerWeek[hot ? 1 : 0],
    funds: L.pool + cB - cS - st.homeMealCost * diffDays(td, cwk.end) // 今週の残りを家で食べても足りる額
  };
  return L;
}
function dinnerMax(L, dateStr) {
  var c = L.cur, max = c.funds, cap = DB.settings.monthlyFoodCap;
  if (cap > 0) max = Math.min(max, cap - foodSpent(c.period.start, fromYmd(dateStr)));
  return max;
}
function storeOpenAt(x, wd, t) {
  if (x.closedWd.indexOf(wd) >= 0) return false;
  if (x.open && x.close) return x.open <= x.close ? (t >= x.open && t < x.close) : (t >= x.open || t < x.close);

  // 新しく晩ご飯を付けるときだけ、旧版と同じ外食の分類にしておく
  function applyKind(x, isNew) {

    else { delete x.dinner; if (!isNew) x.memo = ""; if (x.catId === "eatout") x.catId = DB.cats.some(function (c) { return c.id === "food"; }) ? "food" : "other"; }
  }

    // 晩ご飯は「どこで」を入れなおせる。日中のメモは入力欄をなくしたので、いまの値を保つ
    if (e) { e.amount = amt; e.date = date; if ((e.dinner === true) !== (editKind === "dinner")) applyKind(e); if (editKind === "dinner") e.memo = where; }
  } else {

function cumChartSvg(p, prevP, prevTotal) {
  var W = 320, H = 130, PAD = 6;
  var days = diffDays(p.start, p.end) + 1;
  var tdy = today();
  function cumOf(start, end) {
    var arr = [], sum = 0;
    var byDate = {};
    entriesBetween(start, end).forEach(function (e) { byDate[e.date] = (byDate[e.date] || 0) + e.amount; });
    var d = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    while (diffDays(d, end) >= 0) { sum += byDate[ymd(d)] || 0; arr.push(sum); d = addDays(d, 1); }
    return arr;
  }
  var cur = cumOf(p.start, p.end < tdy ? p.end : tdy);
  var prev = prevTotal > 0 ? cumOf(prevP.start, prevP.end) : [];
  if (prev.length > days) prev = prev.slice(0, days); // 「同じ日数目」で比べる（X軸の分母を当期に合わせる）
  var maxV = Math.max(cur.length ? cur[cur.length - 1] : 0, prev.length ? prev[prev.length - 1] : 0, 1);
  function pt(i, v, n) {
    var x = PAD + (W - 2 * PAD) * (n <= 1 ? 0 : i / (n - 1));
    var y = H - PAD - (H - 2 * PAD) * (v / maxV);
    return x.toFixed(1) + "," + y.toFixed(1);
  }
  var curPts = cur.map(function (v, i) { return pt(i, v, days); }).join(" ");
  var prevPts = prev.map(function (v, i) { return pt(i, v, days); }).join(" ");
  var svg = '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:auto;display:block">';
  if (prevPts) svg += '<polyline points="' + prevPts + '" fill="none" stroke="var(--ink-soft)" stroke-width="1.6" stroke-linecap="round" opacity=".38" stroke-dasharray="3 4"/>';
  if (cur.length > 1) {
    svg += '<polygon points="' + pt(0, 0, days) + " " + curPts + " " + pt(cur.length - 1, 0, days) + '" fill="var(--rose)" opacity=".12"/>';
    svg += '<polyline points="' + curPts + '" fill="none" stroke="var(--rose-deep)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
  }
  if (cur.length) {
    var lastP = pt(cur.length - 1, cur[cur.length - 1], days).split(",");
    svg += '<circle cx="' + lastP[0] + '" cy="' + lastP[1] + '" r="4" fill="var(--rose-deep)"/>';
  }
  svg += "</svg>";
  return svg;
}

// シートを下へ引くと閉じる（いちばん上までスクロールしているときだけ。入力中の操作はじゃましない）
function wireSheetDrag(sh) {
  if (!sh) return;
  var y0 = null, dy = 0, live = false;
  sh.addEventListener("touchstart", function (ev) {
    if (ev.touches.length !== 1 || /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) { y0 = null; return; }
    y0 = ev.touches[0].clientY; dy = 0; live = false;
  }, { passive: true });
  sh.addEventListener("touchmove", function (ev) {
    if (y0 === null) return;
    dy = ev.touches[0].clientY - y0;
    if (!live && (dy <= 6 || sh.scrollTop > 0)) { if (dy < 0 || sh.scrollTop > 0) y0 = null; return; }
    live = true;
    if (ev.cancelable) ev.preventDefault(); // シートが引かれている間は、中身や裏の画面をスクロールさせない
    sh.classList.add("dragging");
    sh.style.transform = "translateY(" + Math.max(0, dy) + "px)";
  }, { passive: false });
  sh.addEventListener("touchcancel", function () { // 通知や着信でタッチが取り消されたら、閉じずに元の位置へ
    sh.classList.remove("dragging"); sh.style.transform = ""; y0 = null; live = false;
  });
  sh.addEventListener("touchend", function () {
    if (!live) { y0 = null; return; }
    sh.classList.remove("dragging"); sh.classList.add("closing");
    if (dy > 90) { sh.style.transform = "translateY(100%)"; setTimeout(function () { if (sh.isConnected) closeModal(); }, 180); }
    else { sh.style.transform = ""; setTimeout(function () { sh.classList.remove("closing"); }, 220); }
    y0 = null; live = false;
  });
}
var modalAfterClose = null; // 閉じたあとに戻るシート（記録シート→日別シート）
function closeModal() {
  document.activeElement && document.activeElement.blur();
  $("modalRoot").innerHTML = "";
  sheetDate = null;
  var after = modalAfterClose; modalAfterClose = null;
  // シートを開いたまま日付が変わっていたら、閉じたときに今日の表示へ
  if (ymd(today()) !== lastDay) { lastDay = ymd(today()); render(); }
  if (after) { // 次のシートを開くので、裏の画面の固定はそのまま
    after();

    var ns = $("modalRoot").querySelector(".sheet");
    if (ns) { ns.style.pointerEvents = "none"; setTimeout(function () { ns.style.pointerEvents = ""; }, 400); }

}

// 75オクテット制限に合わせた行折り返し（マルチバイト安全・継続行は先頭スペース）
function icsFold(line) {
  var out = "", cur = "", bytes = 0;
  var chars = Array.from(line);
  for (var i = 0; i < chars.length; i++) {
    var b = unescape(encodeURIComponent(chars[i])).length;
    if (bytes + b > 70) { out += cur + "\r\n "; cur = ""; bytes = 1; }
    cur += chars[i]; bytes += b;
  }
  return out + cur;
}
function buildIcs() {
  var st = DB.settings;
  var start = today();
  var end = new Date(start.getFullYear(), start.getMonth() + 13, start.getDate());
  var stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
  var L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//oshidoricho//JP", "CALSCALE:GREGORIAN",
    icsFold("X-WR-CALNAME:おしどり帳（締め日・週のスタート）")];
  function ev(uid, d, summary, desc, alarmText) {
    var ds = ymd(d).replace(/-/g, "");
    L.push("BEGIN:VEVENT", "UID:" + uid + "@oshidoricho", "DTSTAMP:" + stamp,
      "DTSTART:" + ds + "T080000", "DTEND:" + ds + "T081500",
      icsFold("SUMMARY:" + summary), icsFold("DESCRIPTION:" + desc),
      "BEGIN:VALARM", "ACTION:DISPLAY", icsFold("DESCRIPTION:" + alarmText),
      "TRIGGER:-PT0M", "END:VALARM", "END:VEVENT");
  }
  var count = 0;
  // 💳 クレカ締め日（毎月・月末丸め）
  for (var i = 0; i <= 13; i++) {
    var y = start.getFullYear(), m = start.getMonth() + i; // 0始まりのまま加算
    var last = new Date(y, m + 1, 0).getDate();
    var cd = new Date(y, m, Math.min(st.cardCloseDay, last));
    if (diffDays(start, cd) >= 0 && diffDays(cd, end) >= 0) {
      ev("close-" + ymd(cd).replace(/-/g, ""), cd,
        "💳 クレカ締め日", "この日までの分が今回の請求。おしどり帳の「ふたり会議」でふりかえりを☕",
        "きょうはクレカの締め日！💳 おしどり帳でチェック");
      count++;
    }
  }
  // 🍚 食費週スタート（毎週・祝日調整済み）
  var p = foodPeriod(start, st.foodAnchorDay);
  while (diffDays(p.start, end) >= 0) {
    p.weeks.forEach(function (w) {
      if (diffDays(start, w.start) >= 0 && diffDays(w.start, end) >= 0) {
        ev("foodweek-" + ymd(w.start).replace(/-/g, ""), w.start,
          "🍚 週のスタート", "第" + w.idx + "週（" + jdate(ymd(w.start)) + "〜" + jdate(ymd(w.end)) + "）。週予算リセットの日",
          "きょうから新しい週！🍚");
        count++;
      }
    });
    p = foodPeriod(addDays(p.end, 1), st.foodAnchorDay);
  }
  L.push("END:VCALENDAR");
  return { text: L.join("\r\n") + "\r\n", count: count, from: start, to: end };
}

  if (file && navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {

  } else {

}

function bkTime(ts) { if (!ts) return ""; var d = new Date(ts); return (d.getMonth() + 1) + "/" + d.getDate() + " " + d.getHours() + ":" + ("0" + d.getMinutes()).slice(-2) + " 保存"; }
function bkLabel(key) {
  if (key === "mirror") return "いちばん新しい控え";
  if (key === "pre-import") return "読み込みで置き換える直前";
  if (key === "pre-restore") return "復元する直前";
  if (key.indexOf("snap-") === 0) return jdate(key.slice(5)) + " の控え";
  return key;
}
function openBackupList() {
  idbKeys(function (keys) {
    keys = keys.filter(function (k) { return typeof k === "string"; });
    // 新しい順: mirror → 直前控え → 日付スナップ降順
    var order = { "mirror": 0, "pre-import": 1, "pre-restore": 1 };
    keys.sort(function (a, b) {
      var oa = (a in order) ? order[a] : 2, ob = (b in order) ? order[b] : 2;
      return oa !== ob ? oa - ob : (a < b ? 1 : -1);
    });
    if (!keys.length) { showModal("<h3>🛟 じどうバックアップ</h3><p class=\"muted\">控えはまだありません。きろくを保存すると自動で作られます。</p>"); return; }
    // 全件読み終えてから、キー順どおりに一括で描画する（コールバックの到着順に依存させない）
    var got = {}, remain = keys.length;
    keys.forEach(function (k) {
      idbGet(k, function (v) {
        got[k] = v; remain--;
        if (remain > 0) return;
        var h = "<h3>🛟 じどうバックアップ</h3><p class=\"muted\" style=\"margin:0 0 10px\">タップすると、その控えの内容に戻せます（いまの状態も「復元する直前」として控えに残ります）。</p><div id=\"bkList\"></div>";
        showModal(h);
        var host = $("bkList");
        keys.forEach(function (k2) {
          var v2 = got[k2];
          if (!host || !v2) return;
          var btn = document.createElement("button");
          btn.className = "bk-row";
          btn.innerHTML = '<div class="bk-main"><div class="bk-d"></div><div class="bk-n"></div></div><span class="bk-arrow">›</span>';
          btn.querySelector(".bk-d").textContent = bkLabel(k2);
          btn.querySelector(".bk-n").textContent = "きろく " + (v2.n || 0) + "件・" + bkTime(v2.at);
          btn.addEventListener("click", function () { restoreBackup(k2); });
          host.appendChild(btn);
        });
      });
    });
  });
}
function restoreBackup(key) {
  idbGet(key, function (v) {
    if (!v || !v.json) { toast("この控えは読めませんでした"); return; }
    var d;
    try { d = migrate(JSON.parse(v.json)); } catch (e) { toast("この控えは読めませんでした"); return; }
    if (!confirm("「" + bkLabel(key) + "」（きろく" + (v.n || 0) + "件）に置き換えます。お店リストや給与日の指定も、その時点にもどります。よろしいですか？")) return;
    idbPut("pre-restore", { json: JSON.stringify(DB), at: Date.now(), n: recCount(DB) });
    DB = d;
    if (save()) toast("🛟 復元しました");
    closeModal(); closeData(); render();
  });
}
function exportData() {
  var text = JSON.stringify(DB);
  function done() { DB.settings.lastExportAt = new Date().toISOString(); save(); toast("コピーしました📋"); }
  function fallback() {
    var ta = $("ioText"); ta.value = text; ta.focus(); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("下の欄から手動でコピーしてね"); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, fallback);
  } else fallback();
}
function importData() {
  var text = $("ioText").value.trim();
  if (!text) { toast("データを貼り付けてね"); return; }
  var d;
  try { d = JSON.parse(text); } catch (e) { toast("データの形が読めませんでした"); return; }
  if (!d || typeof d !== "object" || !Array.isArray(d.entries)) { toast("おしどり帳のデータではないみたい"); return; }
  if (!confirm("いまの記録を置き換えて読み込みます。お店リストや給与日の指定も読み込むデータの内容になります。よろしいですか？")) return;
  var nd;
  try { nd = migrate(d); } catch (e) { toast("データの中身が読めませんでした（いまの記録は無事です）"); return; }
  // 置き換える直前の状態を控えに残す（まちがえてももどせる）
  idbPut("pre-import", { json: JSON.stringify(DB), at: Date.now(), n: recCount(DB) });
  var wanted = (Array.isArray(d.entries) ? d.entries.length : 0) + (Array.isArray(d.zeroDays) ? d.zeroDays.length : 0);
  var kept = recCount(nd);
  DB = nd;
  if (save()) toast(kept < wanted ? "読み込みました（" + (wanted - kept) + "件は日付が読めずスキップ）" : "読み込みました🌸");
  closeData(); render();
}
function wipeData() {
  if (!confirm("すべての記録・設定を消します（じどうバックアップの控えも消えます）。よろしいですか？")) return;
  if (!confirm("ほんとうに消しますか？（もとに戻せません）")) return;
  DB = blank();
  try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {}
  // 控えも約束どおりぜんぶ消す（save()経由だと新しい控えができてしまうため直接書く）
  idbKeys(function (keys) { keys.forEach(function (k) { idbDel(k); }); });
  toast("まっさらにしました");
  closeData(); render();
}

/* ---------- つかいかた ---------- */
function openHelp() { renderHelp(); $("helpPage").scrollTop = 0; $("helpScrim").classList.add("show"); $("helpPage").classList.add("show"); }
function closeHelp() { $("helpScrim").classList.remove("show"); $("helpPage").classList.remove("show"); }

    '<div class="card"><h3 style="margin-top:0">🦆 おしどり帳って？</h3>' +

    '<div class="card"><h3 style="margin-top:0">スタンプのいみ</h3>' +

    '<div class="stamp-sample"><span class="s" style="color:var(--teal)">○</span>〜' + comma(st.thresholds[1]) + "円</div>" +
    '<div class="stamp-sample"><span class="s" style="color:var(--amber)">△</span>〜' + comma(st.thresholds[2]) + "円</div>" +
    '<div class="stamp-sample"><span class="s">💦</span>それより上</div>' +
    '<p class="muted">きんがくは設定でかえられます。スタンプは、晩ご飯をのぞいた日中の金額で決まります。</p></div>' +
    '<div class="card"><h3 style="margin-top:0">📅 カレンダー</h3>' +
    "<p>日付をタップすると、その日のきろくを見たり、あとから直したりできます。💳は締め日、🍚は週のスタート、💴は給与日の目じるしです。</p>" +
    "<p>給与日が前にずれた月は、その日をタップして「この日を給与日にする」を押すと、そこから1週間ごとに組み直します。iPhoneカレンダーへ登録した通知は自動では動かないので、登録し直してください。</p></div>" +
    '<div class="card"><h3 style="margin-top:0">🍽 今日の晩ご飯</h3>' +

    "<p>食べたら、予定どおりだったかを残します。家の案の日は「🏠 家で食べた」で外食0円、お店の案の日は「✅ 予定どおり食べた」でそのお店・予算どおりの金額がつきます。予定とちがったら「✍️ ちがった」で、実際にどこで・いくらだったかを入れてください（家なら「🏠 家（0円）」を押すだけ）。晩ご飯は日中のきろくとは別あつかいです。「選び直し」は1日1回、今のお店より安いお店から選び直します。</p>" +

/* ---------- 初期化 ---------- */
// iPhoneのSafariは、タッチの受け口がひとつも無いページでは「押している間」の見た目（:active）を出さない
document.addEventListener("touchstart", function () {}, { passive: true });
$("menuBtn").addEventListener("click", openMenu);
$("setBack").addEventListener("click", closeSettings);
$("setScrim").addEventListener("click", closeSettings);
$("dataBack").addEventListener("click", closeData);
$("dataScrim").addEventListener("click", closeData);
$("helpBack").addEventListener("click", closeHelp);
$("helpScrim").addEventListener("click", closeHelp);
render();
if (_loadFailed) toast("⚠️ 前回のデータが読めなかったため、まっさらから始めています");

/* ---------- まもり（v1.1）: 起動時のケア ---------- */
// ① iOSに「このサイトのデータを自動で消さないで」とお願いする（対応OSでは削除されにくくなる）
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}

// ② ホーム画面アプリではなくブラウザのタブで開いているときは、保存場所が別になる注意を出す
var IS_APP = false;
try { IS_APP = (navigator.standalone === true) || (window.matchMedia && matchMedia("(display-mode: standalone)").matches); } catch (e) {}
if (!IS_APP) $("browserWarn").classList.add("show");

// ③ 保存データが空で始まったときは、IndexedDBの控えから自動復元を試みる
if (!_raw || _loadFailed) {
  idbGet("mirror", function (m) {
    if (!m || !m.json) return;
    var d;
    try { d = migrate(JSON.parse(m.json)); } catch (e) { return; }
    if (recCount(d) === 0) return;
    if (recCount(DB) > 0) return; // すでに新しい記録が始まっていたら黙って上書きしない（控えは一覧から選べる）
    DB = d;
    save(); render();
    toast("🛟 自動バックアップから きろくを復元しました");
  });
}
pruneSnaps();

// 日付が変わったとき（アプリを開きっぱなし→復帰）に表示を更新
// ※入力中のシートがあるときは邪魔しない（閉じたときには次のrender()で最新になる）
var lastDay = ymd(today());
document.addEventListener("visibilitychange", function () {
  if (!document.hidden && ymd(today()) !== lastDay && !$("modalRoot").firstChild) {
    lastDay = ymd(today());
    // 晩ご飯の案を作ると保存が走るので、別タブの新しいきろくを古い内容で上書きしないよう読み直す
    try { var fresh = localStorage.getItem(KEY); if (fresh) DB = migrate(JSON.parse(fresh)); } catch (e) {}
    render();
  }
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js").catch(function () {}); });
}
</script>
